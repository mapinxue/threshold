name: threshold

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threshold}
      POSTGRES_USER: ${POSTGRES_USER:-threshold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threshold}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - threshold-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  threshold-postgres-data:
